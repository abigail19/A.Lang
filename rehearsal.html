<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多语言智能听写与朗读工具</title>
    <style>
        /* 核心修改：设置全屏背景图和磨砂玻璃效果 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-image: url('image/phrotein'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center; /* 垂直居中 */
            overflow: hidden; /* 防止背景滚动 */
        }

        /* 核心修改：卡片式半透明布局 */
        .container { 
            background: rgba(255, 255, 255, 0.85); /* 半透明白色背景 */
            backdrop-filter: blur(8px); /* 磨砂玻璃效果 */
            -webkit-backdrop-filter: blur(8px); /* 兼容性 */
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.15); /* 更柔和的阴影 */
            max-width: 600px; 
            width: 90%; /* 在小屏幕上留出边距 */
            text-align: center; /* 文字默认居中 */
        }

        h2 { 
            color: #1e3a8a; /* 暗蓝色字体 */
            margin-top: 0; 
            font-weight: 600;
        }

        .tips { 
            color: #64748b; 
            font-size: 14px; 
            margin-bottom: 15px; /* 减小间距 */
        }
        
        /* 语言选择器样式调整 */
        .lang-selector { 
            margin-bottom: 20px; /* 调整间距 */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .lang-selector label {
            color: #334155;
            font-weight: 500;
        }

        select { 
            padding: 8px 12px; 
            border-radius: 8px; /* 更圆润的边角 */
            border: 2px solid #cbd5e1; 
            font-size: 14px; 
            outline: none; 
            cursor: pointer; 
            background: rgba(255, 255, 255, 0.9);
            min-width: 150px;
        }
        select:focus { 
            border-color: #1e3a8a; 
        }

        textarea { 
            width: 100%; 
            height: 200px; /* 增加高度 */
            padding: 12px; 
            box-sizing: border-box; 
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 18px; 
            line-height: 1.6; 
            outline: none; 
            resize: vertical; 
            background: rgba(255, 255, 255, 0.9); /* 半透明文本框 */
            color: #333;
            margin-bottom: 15px; /* 增加下方间距 */
        }
        textarea:focus { 
            border-color: #1e3a8a; 
        }
        textarea::placeholder {
            color: #94a3b8;
        }
        
        .controls { 
            margin: 0; /* 清空间距，使用 textarea 的 bottom-margin */
            display: flex; 
            gap: 12px; /* 增加按钮间距 */
            justify-content: center; 
            flex-wrap: wrap; 
        }

        /* 按钮通用样式调整 */
        button { 
            border: none; 
            padding: 10px 20px; /* 减小上下 padding，使其更扁平 */
            border-radius: 8px; /* 更圆润的边角 */
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600; 
            transition: all 0.2s; 
            display: flex;
            align-items: center;
            gap: 8px; /* 文字和图标的间距 */
        }
        
        .btn-record { 
            background-color: #f87171; /* 柔和的红色 */
            color: white; 
        }
        .btn-record.recording { 
            background-color: #ef4444; 
            animation: pulse 1.5s infinite; 
        }
        .btn-play { 
            background-color: #34d399; /* 柔和的绿色 */
            color: white; 
        }
        .btn-clear { 
            background-color: #94a3b8; /* 柔和的灰色 */
            color: white; 
        }
        button:hover { 
            opacity: 0.9; 
            transform: translateY(-2px); /* 更明显的上移 */
        }
        
        #status { 
            text-align: center; 
            font-size: 14px; 
            color: #1e3a8a; 
            font-weight: 600; 
            height: 20px; 
            margin-top: 15px; /* 增加顶部间距 */
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Multi-Language Rehearsal Agent</h2>
    <div class="tips">（Phrotein NLP SplitMode）</div>
    
    <div class="lang-selector">
        <label>Select Language: </label>
        <select id="langSelect">
            <option value="zh-CN">Chinese (中文)</option>
            <option value="en-US">English (US)</option>
            <option value="ko-KR">Korean (한국어)</option>
            <option value="es-ES">Spanish (español)</option>
            <option value="ja-JP">Japanese (日本語)</option>
        </select>
    </div>

    <textarea id="textBox" placeholder="Click『Start recording』to begin..."></textarea>
    
    <div class="controls">
        <button id="recordBtn" class="btn-record" onclick="toggleRecord()">🎙️ Start recording</button>
        <button class="btn-play" onclick="speakText()">🔊 Check pronunciation</button>
        <button class="btn-clear" onclick="clearText()">🗑️ Clear</button>
    </div>
    
    <div id="status"></div>
</div>

<script>
    // 这部分的 JavaScript 逻辑和上一版完全一致，没有修改
    const textBox = document.getElementById('textBox');
    const recordBtn = document.getElementById('recordBtn');
    const statusDiv = document.getElementById('status');
    const langSelect = document.getElementById('langSelect');

    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => { statusDiv.textContent = "Recording..."; };

        recognition.onresult = (event) => {
            let resultText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    const currentLang = langSelect.value;
                    resultText += polishAndSplitText(event.results[i][0].transcript, currentLang);
                }
            }
            if (resultText) {
                textBox.value += resultText;
            }
        };

        recognition.onerror = (event) => {
            statusDiv.textContent = "Error: " + event.error;
            stopRecording();
        };

        recognition.onend = () => {
            if (isRecording) {
                recognition.start();
            } else {
                statusDiv.textContent = "Finished";
            }
        };
    } else {
        statusDiv.textContent = "Browser not supported.";
        recordBtn.disabled = true;
    }

    function polishAndSplitText(text, lang) {
        if (!text) return "";
        text = text.trim();

        if (lang !== 'zh-CN') {
            return text + ". "; 
        }

        const fillers = ["嗯", "啊", "那个", "那什么", "就是说", "然后", "额", "吧"];
        fillers.forEach(filler => {
            const reg = new RegExp(filler + "+", "g");
            text = text.replace(reg, "");
        });

        if (text.length === 0) return "";

        let result = "";
        let currentChunk = "";
        const maxLength = 7; 

        for (let i = 0; i < text.length; i++) {
            let char = text.charAt(i);
            currentChunk += char;

            if (/[，。？！；,.;?!]/.test(char)) {
                result += currentChunk;
                currentChunk = "";
                continue;
            }

            if (currentChunk.length >= maxLength) {
                result += currentChunk + "，";
                currentChunk = "";
            }
        }

        if (currentChunk.length > 0) result += currentChunk;
        
        result = result.trim();
        if (result.length > 0 && !/[。？！，；]/.test(result.charAt(result.length - 1))) {
            result += "。";
        }
        
        return result.replace(/，+/g, "，").replace(/。+/g, "。").replace(/，。/g, "。") + " ";
    }

    function toggleRecord() {
        if (!isRecording) {
            textBox.value = "";
            recognition.lang = langSelect.value;
            recognition.start();
            isRecording = true;
            recordBtn.textContent = "⏹️ Stop";
            recordBtn.classList.add('recording');
        } else {
            stopRecording();
        }
    }

    function stopRecording() {
        recognition.stop();
        isRecording = false;
        recordBtn.textContent = "🎙️ Start recording";
        recordBtn.classList.remove('recording');
    }

    function speakText() {
        const textToSpeak = textBox.value.trim();
        if (!textToSpeak) {
            statusDiv.textContent = "Please input some text first!";
            return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        
        utterance.lang = langSelect.value;
        utterance.rate = 0.9; 
        
        window.speechSynthesis.speak(utterance);
    }

    function clearText() { 
        textBox.value = ""; 
        statusDiv.textContent = "Cleared"; 
    }
</script>

</body>
</html>
