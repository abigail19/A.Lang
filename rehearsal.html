<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能短句听写与朗读工具</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px; width: 100%; }
        h2 { color: #000000; margin-top: 0; text-align: center; }
        .tips { color: #64748b; font-size: 14px; text-align: center; margin-bottom: 20px; }
        textarea { width: 100%; height: 160px; padding: 12px; box-sizing: border-box; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 18px; line-height: 1.6; outline: none; resize: vertical; }
        textarea:focus { border-color: #1e3a8a; }
        .controls { margin: 15px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s; }
        .btn-record { background-color: #ef4444; color: white; }
        .btn-record.recording { background-color: #b91c1c; animation: pulse 1.5s infinite; }
        .btn-play { background-color: #10b981; color: white; }
        .btn-clear { background-color: #64748b; color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        #status { text-align: center; font-size: 14px; color: #1e3a8a; font-weight: bold; height: 20px; margin-top: 10px; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Personal Rehearsal Agent</h2>
    <div class="tips">（Phrotein NLP SplitMode）</div>
    
    <textarea id="textBox" placeholder="Click『Start recording』，Phrotein AI makes sure your message is understood ..."></textarea>
    
    <div class="controls">
        <button id="recordBtn" class="btn-record" onclick="toggleRecord()">🎙️ Start recording</button>
        <button class="btn-play" onclick="speakText()">🔊 Check pronunciation</button>
        <button class="btn-clear" onclick="clearText()">🗑️ Clear</button>
    </div>
    
    <div id="status"></div>
</div>

<script>
    const textBox = document.getElementById('textBox');
    const recordBtn = document.getElementById('recordBtn');
    const statusDiv = document.getElementById('status');

    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'zh-CN';

        recognition.onstart = () => { statusDiv.textContent = "Recording..."; };

        recognition.onresult = (event) => {
            let resultText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    // 使用升级版的智能短句切分函数
                    resultText += polishAndSplitText(event.results[i][0].transcript);
                }
            }
            if (resultText) {
                textBox.value += resultText;
            }
        };

        recognition.onerror = (event) => {
            statusDiv.textContent = "识别出错: " + event.error;
            stopRecording();
        };

        recognition.onend = () => {
            if (isRecording) recognition.start();
            else statusDiv.textContent = "Recorded";
        };
    } else {
        statusDiv.textContent = "Sorry, your browser does not support local speech recognition. Please use Chrome or Edge。";
        recordBtn.disabled = true;
    }

    // 核心改进：本地长句智能切分函数
    function polishAndSplitText(text) {
        if (!text) return "";
        
        // 1. 过滤掉结巴词和语气词
        const fillers = ["嗯", "啊", "那个", "那什么", "就是说", "然后", "额", "吧"];
        fillers.forEach(filler => {
            const reg = new RegExp(filler + "+", "g");
            text = text.replace(reg, "");
        });

        text = text.trim();
        if (text.length === 0) return "";

        // 2. 智能长度切分算法（每隔 7 个字，寻找合适位置切一刀）
        let result = "";
        let currentChunk = "";
        const maxLength = 7; // 设定人类背诵最舒服的单句字数上限

        for (let i = 0; i < text.length; i++) {
            let char = text.charAt(i);
            currentChunk += char;

            // 遇到天然的标点，直接作为一个切分点
            if (/[，。？！；,.;?!]/.test(char)) {
                result += currentChunk;
                currentChunk = "";
                continue;
            }

            // 当攒的字数超过设定上限时
            if (currentChunk.length >= maxLength) {
                // 看看后面有没有连接词或语气词可以作为“软着陆”切分点
                let nextChar = text.charAt(i + 1);
                
                // 如果下一个字是常见的停顿字，或者干脆强制在这里切一刀
                if (/[的了呢嘛]/.test(char) || i === text.length - 1) {
                    result += currentChunk + "，";
                    currentChunk = "";
                } else if (i < text.length - 1 && !/[的了呢嘛]/.test(nextChar)) {
                    // 如果不是语气词，为了不破坏词义，我们多等1-2个字再切，或者直接温和切断
                    result += currentChunk + "，";
                    currentChunk = "";
                }
            }
        }

        // 把最后剩下的尾巴加上
        if (currentChunk.length > 0) {
            result += currentChunk;
        }

        // 3. 规范末尾标点
        result = result.trim();
        if (result.length > 0 && !/[。？！，；]/.test(result.charAt(result.length - 1))) {
            result += "。";
        }
        
        // 把连续多余的逗号句号清理一下
        result = result.replace(/，+/g, "，").replace(/。+/g, "。").replace(/，。/g, "。");

        return result;
    }

    // 控制录音开关
    function toggleRecord() {
        if (!isRecording) {
            textBox.value = "";
            recognition.start();
            isRecording = true;
            recordBtn.textContent = "⏹️ Stop";
            recordBtn.classList.add('recording');
        } else {
            stopRecording();
        }
    }

    function stopRecording() {
        recognition.stop();
        isRecording = false;
        recordBtn.textContent = "🎙️ Start recording";
        recordBtn.classList.remove('recording');
    }

    // 语音合成（TTS）
    function speakText() {
        const textToSpeak = textBox.value.trim();
        if (!textToSpeak) {
            statusDiv.textContent = "请先输入或录入一些文字！";
            return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9; // 稍微放慢一点点语速，更方便你跟读和背诵
        window.speechSynthesis.speak(utterance);
    }

    function clearText() { textBox.value = ""; statusDiv.textContent = "Clear"; }
</script>

</body>
</html>
