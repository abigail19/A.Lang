<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phrotein | AI for Education & Training</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      color: #333;
      padding: 40px 20px;
      text-align: center;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    p.description {
      font-size: 1.2rem;
      max-width: 700px;
      margin: 0 auto;
      color: #555;
    }

    .games-section {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
      margin-top: 60px;
    }

    .game-card {
      width: 300px;
      text-align: center;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      background: #fff;
      transition: transform 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-8px);
    }

    .game-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .game-title {
      padding: 16px;
      font-size: 1.4rem;
      font-weight: bold;
      color: #34495e;
    }

    footer {
      margin-top: 60px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Phrotein</h1>
    <p class="description">
      Phrotein utilizes AI to design solutions for complicated problems encountered in education and training scenarios.<br />
      It powers uniform, high-quality solutions for group training.
    </p>
  </header>

  <section class="games-section">
    <a href="promise.html" class="game-card">
      <img src="Promise.jpg" alt="Promise Game" />
      <div class="game-title">Promise</div>
    </a>

    <a href="stream.html" class="game-card">
      <img src="Stream.jpg" alt="Stream Game" />
      <div class="game-title">Stream</div>
    </a>
  </section>

  <footer>
    © 2025 Phrotein. All rights
