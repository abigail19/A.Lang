<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preschool Business Thriver Services</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f8f5f0;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }
        .main-image {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* 下载按钮悬浮在图上（也可以放在图下方） */
        .download-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background-color: #ff9966;
            color: #000;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }
        .download-btn:hover {
            background-color: #ff7733;
        }
    </style> <!-- 补充缺失的style闭合标签 -->
</head>
<body>
    <div class="main-container">
        <!-- 修复：删除了多余的）和引号 -->
        <img src="./images/card.png" alt="Convert SFH to Preschool Business" class="main-image">
        <!-- 修复：删除了多余的引号 -->
        <a href="./images/checklist.png" class="download-btn" download>
            Free Download<br>Child Care Center Setup Checker List
        </a>
    </div>
</body>
</html>
